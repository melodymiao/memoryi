<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Passport</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Doto:wght@800&amp;family=Inter+Tight:wght@400;500&amp;family=Instrument+Serif&amp;family=Instrument+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;background:#F4F3EA}
a{color:#28301C}a:hover{color:#444444}
.dot{font-family:'Doto',monospace;font-weight:800;letter-spacing:0.02em}
.tick{position:relative;display:inline-flex;align-items:center;justify-content:center;min-width:16px;height:24px;padding:0 3px;box-sizing:border-box;border-radius:4px;background:#3A4428;overflow:hidden}
.tick::after{content:"";position:absolute;left:0;right:0;top:50%;height:1px;background:#1A2012}
.flap{position:relative;display:inline-flex;align-items:center;justify-content:center;height:62px;box-sizing:border-box;border-radius:8px;overflow:hidden}
.flap::after{content:"";position:absolute;left:0;right:0;top:50%;height:2px;margin-top:-1px;background:#1A2012}
.perf{display:block;text-decoration:none;padding:5px;background:radial-gradient(circle, transparent 2.6px, #FFFFFF 3.1px) -4.5px -4.5px / 9px 9px;filter:drop-shadow(0 3px 8px rgba(0,0,0,0.08))}
.halftone{position:relative;aspect-ratio:1;overflow:hidden}
</style>
</helmet>
<div style="width: 390px; height: 1130px; box-sizing: border-box; position: relative; overflow: hidden; background: #F4F3EA; font-family: 'Inter Tight', 'Instrument Sans', sans-serif; font-weight: 400; color: #28301C; padding: 64px 20px 0; display: flex; flex-direction: column; gap: 20px">



<div style="display: flex; flex-direction: column; gap: 16px">
<div style="background: #28301C; color: #FFFFFF; border-radius: 24px; padding: 20px 20px 22px; display: flex; flex-direction: column; gap: 14px">
<span class="dot" style="font-size: 16px; line-height: 1; color: #B3BA8C">MILES FLOWN</span>
<div style="display: flex; align-items: flex-end; gap: 5px">
<sc-for list="{{miles}}" as="m" hint-placeholder-count="5">
<span class="flap" style="width: {{m.w}}; background: {{m.bg}}"><span class="dot" style="font-size: 44px; line-height: 1">{{m.c}}</span></span>
</sc-for>

</div>
</div>

<div style="background: #FFFFFF; border-radius: 28px; padding: 20px 22px; display: flex; justify-content: space-between; gap: 16px">
<div style="display: flex; flex-direction: column; gap: 4px"><span style="font-size: 15px; color: #7E846C">Days tgt</span><span style="font-size: 26px; line-height: 1.1; letter-spacing: -0.02em">41</span></div><div style="display: flex; flex-direction: column; gap: 4px"><span style="font-size: 15px; color: #7E846C">Visits</span><span style="font-size: 26px; line-height: 1.1; letter-spacing: -0.02em">12</span></div>

<div style="display: flex; flex-direction: column; gap: 4px"><span style="font-size: 15px; color: #7E846C">Cities</span><span style="font-size: 26px; line-height: 1.1; letter-spacing: -0.02em">3</span></div>
</div>
</div>

<section style="display: flex; flex-direction: column; gap: 14px; margin-top: 8px">
<div style="display: flex; justify-content: space-between; align-items: baseline; padding: 0 2px">
<h2 style="margin: 0; font-size: 26px; font-weight: 400; line-height: 1.1; letter-spacing: -0.02em">Stamps</h2>
<span style="font-size: 15px; color: #7E846C">Newest first</span>
</div>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px 10px">
<sc-for list="{{stamps}}" as="s" hint-placeholder-count="6">
<a href="StampDetail.dc.html" class="perf" aria-label="{{s.aria}}" style="transform: rotate({{s.tilt}})">
<div style="background: #FFFFFF; padding: 5px 5px 7px; display: flex; flex-direction: column; gap: 6px">
<div class="halftone" style="background: {{s.tint}}">
<div style="position: absolute; inset: 0; background-image: radial-gradient({{s.ink}} 1.1px, transparent 1.6px); background-size: 4px 4px; opacity: 0.55"></div>
<div style="position: absolute; left: 18%; top: 22%; width: 64%; height: 56%; border-radius: 8px; background-image: radial-gradient({{s.ink}} 1.3px, transparent 1.8px); background-size: 4px 4px; transform: rotate(-12deg)"></div>
</div>
<div style="display: flex; flex-direction: column; gap: 3px; color: {{s.ink}}; padding: 0 1px">
<span style="font-family: 'Instrument Serif', serif; font-size: 16px; line-height: 1; letter-spacing: -0.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{s.city}}</span>
<div style="display: flex; justify-content: space-between; align-items: baseline; gap: 4px">
<span style="font-size: 8px; letter-spacing: 0.06em; text-transform: uppercase; white-space: nowrap">{{s.dates}}</span>
<span style="font-size: 12px; line-height: 1; font-weight: 500">#{{s.n}}</span>
</div>
</div>
</div>
</a>
</sc-for>
<div style="box-sizing: border-box; border: 2px dashed #B9C09A; border-radius: 6px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-height: 140px; padding: 8px; color: #7E846C; text-align: center">
<span style="font-family: 'Instrument Serif', serif; font-size: 16px; line-height: 1.05; color: #5C6450">Los Angeles</span>
<span style="font-size: 11px">#13 · Nov 13</span>
</div>
</div>
</section>

<section style="display: flex; flex-direction: column; gap: 12px; margin-top: 8px">
<h2 style="margin: 0 0 0 2px; font-size: 26px; font-weight: 400; line-height: 1.1; letter-spacing: -0.02em">Most visited</h2>
<div style="background: #FFFFFF; border-radius: 28px; padding: 20px 22px; display: flex; flex-direction: column; gap: 16px; font-size: 15px">
<sc-for list="{{top}}" as="c" hint-placeholder-count="3">
<div style="display: flex; align-items: center; gap: 12px">
<span style="width: 104px; flex-shrink: 0">{{c.city}}</span>
<div style="flex: 1; height: 8px; border-radius: 4px; background: #EEF1E0; overflow: hidden"><div style="width: {{c.pct}}; height: 100%; border-radius: 4px; background: {{c.ink}}"></div></div>
<span style="width: 28px; text-align: right; color: #7E846C">×{{c.count}}</span>
</div>
</sc-for>
</div>
</section>

<nav style="position: absolute; left: 20px; right: 20px; bottom: 24px; height: 64px; background: #FFFFFF; border-radius: 999px; display: flex; align-items: center; justify-content: space-around; box-shadow: 0 4px 20px rgba(0,0,0,0.06); font-family: 'Instrument Sans', system-ui, sans-serif">
<a href="Main.dc.html" aria-label="Home" style="display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; color: #5C6450">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12h20M13 5l7 7-7 7M6 12l-2-4M6 12l-2 4"></path></svg></a>
<a href="Trips.dc.html" aria-label="Trips" style="display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; color: #5C6450">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h16v4a2 2 0 0 0 0 4v4H4v-4a2 2 0 0 0 0-4z"></path><path d="M14 6v12" stroke-dasharray="2 2"></path></svg></a>
<a href="Plans.dc.html" aria-label="Plans" style="display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; color: #5C6450">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 4h10v16l-5-3.5L7 20z"></path></svg></a>
<a href="Passport.dc.html" style="text-decoration: none; display: flex; align-items: center; gap: 6px; height: 44px; padding: 0 16px; border-radius: 999px; background: #28301C; color: #FFFFFF; font-family: 'Inter Tight', sans-serif; font-size: 15px; font-weight: 400; letter-spacing: -0.01em">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="3" width="14" height="18" rx="2"></rect><circle cx="12" cy="10" r="3"></circle><path d="M9 16h6"></path></svg>Passport</a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#D2DB76","options":["#D2DB76","#FFC3CC","#28301C"]},"$preview":{"width":390,"height":1130}}'>
const CITY = {
'Los Angeles': { ink: '#28301C', tint: '#D2DB76' },
'San Francisco': { ink: '#28301C', tint: '#FFC3CC' },
'San Diego': { ink: '#28301C', tint: '#B3BA8C' }
};
const STAMPS = [
{ n: 12, city: 'San Francisco', dates: 'Oct 31 – Nov 2' },
{ n: 11, city: 'Los Angeles', dates: 'Oct 17 – 19' },
{ n: 10, city: 'San Francisco', dates: 'Oct 3 – 5' },
{ n: 9, city: 'Los Angeles', dates: 'Sep 19 – 21' },
{ n: 8, city: 'San Francisco', dates: 'Sep 5 – 7' },
{ n: 7, city: 'San Diego', dates: 'Aug 22 – 24' }
];
const TILTS = ['-1.5deg', '1deg', '0.5deg', '-1deg', '1.5deg', '-0.5deg'];

class Component extends DCLogic {
renderVals() {
const counts = {};
STAMPS.forEach((s) => { counts[s.city] = (counts[s.city] || 0) + 1; });
const max = Math.max.apply(null, Object.values(counts));
const top = Object.keys(counts).sort((a, b) => counts[b] - counts[a]).map((c) => ({ city: c, count: String(counts[c]), pct: Math.round(counts[c] / max * 100) + '%', ink: CITY[c].tint }));
return {
accent: this.props.accent ?? '#D2DB76',
miles: '4,944'.split('').map((c) => (c === ',' ? { c: c, w: '14px', bg: 'transparent' } : { c: c, w: '48px', bg: '#3A4428' })),
stamps: STAMPS.map((s, i) => ({ n: String(s.n), city: s.city, dates: s.dates, ink: CITY[s.city].ink, tint: CITY[s.city].tint, tilt: TILTS[i % TILTS.length], aria: 'Stamp ' + s.n + ', ' + s.city + ', ' + s.dates })),
top: top
};
}
}
</script>
</body>
</html>
