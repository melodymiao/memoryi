<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Trips</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Doto:wght@600;800&amp;family=Inter+Tight:wght@400;500&amp;family=Instrument+Sans:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;background:#F4F3EA}
a{color:#28301C}a:hover{color:#444444}
.dot{font-family:'Doto',monospace;font-weight:800;letter-spacing:0.02em}
.tick{position:relative;display:inline-flex;align-items:center;justify-content:center;min-width:16px;height:24px;padding:0 3px;box-sizing:border-box;border-radius:4px;background:#3A4428;overflow:hidden}
.tick::after{content:"";position:absolute;left:0;right:0;top:50%;height:1px;background:#1A2012}
</style>
</helmet>
<div style="width: 390px; height: 1820px; box-sizing: border-box; position: relative; overflow: hidden; background: #F4F3EA; font-family: 'Instrument Sans', system-ui, sans-serif; color: #28301C; padding: 56px 20px 0; display: flex; flex-direction: column; gap: 20px">

<div style="background: #28301C; color: #FFFFFF; border-radius: 16px; padding: 12px 18px; display: flex; align-items: center; justify-content: space-between">
<div style="display: flex; align-items: center; gap: 8px">
<span class="dot" style="font-size: 16px; line-height: 1">LANDING IN</span>
<div style="display: flex; gap: 3px">
<span class="tick"><span class="dot" style="font-size: 16px; line-height: 1">{{d1}}</span></span>
<span class="tick"><span class="dot" style="font-size: 16px; line-height: 1">{{d2}}</span></span>
</div>
<span class="dot" style="font-size: 16px; line-height: 1">DAYS</span>
</div>

<span style="display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; color: #ffffff; white-space: nowrap">SFO<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="{{accent}}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12h20M13 5l7 7-7 7M6 12l-2-4M6 12l-2 4"></path></svg>LAX</span></div>

<div style="display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; justify-content: space-between; align-items: center; font-family: 'Inter Tight', sans-serif; min-height: 24px">
<span style="font-size: 15px; color: #7E846C">{{cur.flight}}</span>
<sc-if value="{{isPast}}" hint-placeholder-val="{{ false }}">
<button type="button" onClick="{{backToNext}}" style="height: 44px; margin: -10px -4px -10px 0; padding: 0 4px; border: none; background: transparent; cursor: pointer; display: flex; align-items: center; gap: 6px; font-family: inherit; font-size: 15px; color: #28301C">Back to next trip
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></button>
</sc-if>
<sc-if value="{{isNext}}" hint-placeholder-val="{{ true }}">
<button type="button" aria-label="Edit flight" style="width: 44px; height: 44px; margin: -10px -10px -10px 0; border: none; background: transparent; cursor: pointer; display: flex; align-items: center; justify-content: center; color: #28301C">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16z"></path><path d="M13 7l4 4"></path></svg>
</button>
</sc-if>
</div>
<dc-import name="Ticket" trip="{{cur}}" hint-size="100%,430px"></dc-import>
</div>

<section style="display: flex; flex-direction: column; gap: 12px; font-family: 'Inter Tight', 'Instrument Sans', sans-serif; font-weight: 400; margin-top: 8px">
<div style="display: flex; justify-content: space-between; align-items: center">
<h2 style="margin: 0 0 0 2px; font-size: 26px; font-weight: 400; line-height: 1.1; letter-spacing: -0.02em">{{monthName}} <span style="color: #7E846C">{{year}}</span></h2>
<div style="display: flex; gap: 6px">
<button type="button" onClick="{{prevMonth}}" aria-label="Previous month" style="width: 44px; height: 44px; border-radius: 50%; border: none; background: #FFFFFF; cursor: pointer; display: flex; align-items: center; justify-content: center; color: #28301C">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg></button>
<button type="button" onClick="{{nextMonth}}" aria-label="Next month" style="width: 44px; height: 44px; border-radius: 50%; border: none; background: #FFFFFF; cursor: pointer; display: flex; align-items: center; justify-content: center; color: #28301C">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></button>
</div>
</div>
<div style="background: #FFFFFF; border-radius: 28px; padding: 18px 16px; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); row-gap: 6px; text-align: center; font-size: 15px; line-height: 1">
<span style="color: #7E846C; padding-bottom: 6px">S</span><span style="color: #7E846C; padding-bottom: 6px">M</span><span style="color: #7E846C; padding-bottom: 6px">T</span><span style="color: #7E846C; padding-bottom: 6px">W</span><span style="color: #7E846C; padding-bottom: 6px">T</span><span style="color: #7E846C; padding-bottom: 6px">F</span><span style="color: #7E846C; padding-bottom: 6px">S</span>
<sc-for list="{{cells}}" as="c" hint-placeholder-count="35">
<span style="padding: 11px 0; min-height: 15px; background: {{c.bg}}; border-radius: {{c.radius}}; color: {{c.color}}">{{c.label}}</span>
</sc-for>
</div>
</section>

<section style="display: flex; flex-direction: column; gap: 12px; font-family: 'Inter Tight', 'Instrument Sans', sans-serif; font-weight: 400; margin-top: 8px">
<button type="button" onClick="{{togglePlans}}" aria-expanded="{{plansExpanded}}" style="display: flex; justify-content: space-between; align-items: center; min-height: 44px; padding: 0 2px; border: none; background: transparent; cursor: pointer; font-family: inherit; color: #28301C; text-align: left">
<span style="font-size: 26px; line-height: 1.1; letter-spacing: -0.02em">Plans <span style="color: #7E846C">for this trip</span></span>
<span style="display: flex; align-items: center; gap: 8px; font-size: 15px; color: #7E846C">{{planCount}}
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#28301C" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="transform: {{chev}}; transition: transform 0.2s ease"><path d="M6 9l6 6 6-6"></path></svg></span>
</button>
<sc-if value="{{plansOpen}}" hint-placeholder-val="{{ true }}">
<div style="background: #FFFFFF; border-radius: 28px; padding: 6px 22px; display: flex; flex-direction: column; font-size: 15px">
<sc-for list="{{plans}}" as="p" hint-placeholder-count="3">
<button type="button" onClick="{{p.toggle}}" style="display: flex; align-items: center; gap: 14px; min-height: 56px; padding: 0; border: none; border-bottom: 1px solid #E7EAD6; background: transparent; cursor: pointer; font-family: inherit; font-size: 15px; text-align: left; color: #28301C">
<span style="width: 20px; height: 20px; flex-shrink: 0; box-sizing: border-box; border-radius: 50%; border: 1.5px solid {{p.ring}}; background: {{p.fill}}; display: flex; align-items: center; justify-content: center">
<sc-if value="{{p.done}}" hint-placeholder-val="{{ false }}"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg></sc-if>
</span>
<span style="flex: 1; color: {{p.color}}; text-decoration: {{p.deco}}">{{p.name}}</span>
<span style="color: #7E846C">{{p.type}}</span>
</button>
</sc-for>
<a href="Plans.dc.html" style="display: flex; align-items: center; gap: 14px; min-height: 56px; text-decoration: none; color: #7E846C"><span style="width: 20px; text-align: center; font-size: 20px; line-height: 1">+</span><span>Add from ideas</span></a>
</div>
</sc-if>
</section>

<section style="display: flex; flex-direction: column; gap: 12px; font-family: 'Inter Tight', 'Instrument Sans', sans-serif; font-weight: 400; margin-top: 8px">
<div style="display: flex; justify-content: space-between; align-items: baseline; padding: 0 2px">
<h2 style="margin: 0; font-size: 26px; font-weight: 400; line-height: 1.1; letter-spacing: -0.02em">Past tickets</h2>
<a href="Passport.dc.html" style="font-size: 15px; color: #7E846C; text-decoration: none">See stamps →</a>
</div>
<div style="display: flex; flex-direction: column">
<sc-for list="{{stack}}" as="s" hint-placeholder-count="3">
<button type="button" onClick="{{s.pick}}" aria-label="{{s.aria}}" style="position: relative; display: block; width: 100%; height: {{s.h}}; margin-top: {{s.mt}}; padding: 0; border: none; border-radius: 28px; overflow: hidden; background: #FFFFFF; box-shadow: 0 -6px 16px rgba(0,0,0,0.07); cursor: pointer; font-family: inherit">
<dc-import name="Ticket" trip="{{s.trip}}" hint-size="100%,430px"></dc-import>
</button>
</sc-for>
</div>
</section>

<nav style="position: absolute; left: 20px; right: 20px; bottom: 24px; height: 64px; background: #FFFFFF; border-radius: 999px; display: flex; align-items: center; justify-content: space-around; box-shadow: 0 4px 20px rgba(0,0,0,0.06)">
<a href="Main.dc.html" aria-label="Home" style="display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; color: #5C6450">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12h20M13 5l7 7-7 7M6 12l-2-4M6 12l-2 4"></path></svg></a>
<a href="Trips.dc.html" style="text-decoration: none; display: flex; align-items: center; gap: 6px; height: 44px; padding: 0 16px; border-radius: 999px; background: #28301C; color: #FFFFFF; font-family: 'Inter Tight', sans-serif; font-size: 15px; font-weight: 400; letter-spacing: -0.01em">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h16v4a2 2 0 0 0 0 4v4H4v-4a2 2 0 0 0 0-4z"></path><path d="M14 6v12" stroke-dasharray="2 2"></path></svg>Trips</a>
<a href="Plans.dc.html" aria-label="Plans" style="display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; color: #5C6450">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 4h10v16l-5-3.5L7 20z"></path></svg></a>
<a href="Passport.dc.html" aria-label="Passport" style="display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; color: #5C6450">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="3" width="14" height="18" rx="2"></rect><circle cx="12" cy="10" r="3"></circle><path d="M9 16h6"></path></svg></a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#D2DB76","options":["#D2DB76","#FFC3CC","#28301C"]},"$preview":{"width":390,"height":1820}}'>
const TODAY = new Date(2026, 9, 26);
const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const TRIPS = [
{ id: 't14', airline: 'Southwest', flight: 'WN 2207', date: 'Sat, Dec 5', from: 'LAX', depart: '16:20', to: 'SFO', arrive: '17:45', miles: '337 mi', passenger: '[Partner]', term: '1', gate: '22', s: [2026, 11, 5], e: [2026, 11, 8], plans: [] },
{ id: 't13', airline: 'Southwest', flight: 'WN 1234', date: 'Fri, Nov 13', from: 'SFO', depart: '09:30', to: 'LAX', arrive: '11:05', miles: '337 mi', passenger: 'Melody', term: '1', gate: '12', s: [2026, 10, 13], e: [2026, 10, 16], plans: [['[Ramen place]', 'Eat'], ['[Beach sunset walk]', 'Do'], ['[Record store]', 'Go']] },
{ id: 't12', airline: 'Delta', flight: 'DL 2210', date: 'Sat, Oct 31', from: 'LAX', depart: '18:10', to: 'SFO', arrive: '19:35', miles: '337 mi', passenger: '[Partner]', term: '2', gate: 'D4', s: [2026, 9, 31], e: [2026, 10, 2], plans: [['Tartine', 'Eat', 1], ['Dolores Park picnic', 'Do', 1], ['Ferry Building', 'Eat', 0]] },
{ id: 't11', airline: 'Alaska', flight: 'AS 1371', date: 'Sat, Oct 17', from: 'SFO', depart: '07:15', to: 'LAX', arrive: '08:45', miles: '337 mi', passenger: 'Melody', term: '6', gate: '64B', s: [2026, 9, 17], e: [2026, 9, 19], plans: [['Griffith Observatory', 'Go', 1], ['Grand Central Market', 'Eat', 1]] },
{ id: 't10', airline: 'Southwest', flight: 'WN 884', date: 'Sat, Oct 3', from: 'LAX', depart: '17:40', to: 'SFO', arrive: '19:05', miles: '337 mi', passenger: '[Partner]', term: '1', gate: '7', s: [2026, 9, 3], e: [2026, 9, 5], plans: [['Lands End trail', 'Do', 1]] }
];
const D = (a) => new Date(a[0], a[1], a[2]);
const isPastTrip = (t) => D(t.e) < TODAY;
const NEXT_ID = 't13';

class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { sel: NEXT_ID, vy: 2026, vm: 10, plansOpen: true, done: {} };
}
select(id) {
const t = TRIPS.find((x) => x.id === id);
this.setState({ sel: id, vy: t.s[0], vm: t.s[1] });
}
renderVals() {
const accent = this.props.accent ?? '#D2DB76';
const st = this.state;
const trip = TRIPS.find((t) => t.id === st.sel);
const past = isPastTrip(trip);
const cur = Object.assign({}, trip, { past: past });

const next = TRIPS.find((t) => t.id === NEXT_ID);
const days = Math.round((D(next.s) - TODAY) / 86400000);
const dd = String(days).padStart(2, '0');

const first = new Date(st.vy, st.vm, 1).getDay();
const dim = new Date(st.vy, st.vm + 1, 0).getDate();
const cells = [];
for (let i = 0; i < first; i++) cells.push({ label: '', bg: 'transparent', radius: '0', color: '#28301C' });
for (let d = 1; d <= dim; d++) {
const date = new Date(st.vy, st.vm, d);
const dow = date.getDay();
const t = TRIPS.find((x) => date >= D(x.s) && date <= D(x.e));
if (t) {
const l = date.getTime() === D(t.s).getTime() || dow === 0;
const r = date.getTime() === D(t.e).getTime() || dow === 6;
cells.push({ label: String(d), bg: t.id === st.sel ? accent : '#FFC3CC', radius: (l ? '999px ' : '0 ') + (r ? '999px 999px ' : '0 0 ') + (l ? '999px' : '0'), color: '#28301C' });
} else {
cells.push({ label: String(d), bg: 'transparent', radius: '0', color: date < TODAY ? '#7E846C' : '#28301C' });
}
}

const plans = trip.plans.map((p, i) => {
const key = trip.id + ':' + i;
const done = st.done[key] !== undefined ? st.done[key] : !!p[2];
return {
name: p[0], type: p[1], done: done,
ring: done ? '#28301C' : '#C5CBA8', fill: done ? '#28301C' : 'transparent',
color: done ? '#7E846C' : '#28301C', deco: done ? 'line-through' : 'none',
toggle: () => this.setState({ done: Object.assign({}, st.done, { [key]: !done }) })
};
});

const pastList = TRIPS.filter((t) => isPastTrip(t) && t.id !== st.sel).sort((a, b) => D(a.s) - D(b.s));
const stack = pastList.map((t, i) => ({
trip: Object.assign({}, t, { past: true }),
pick: () => this.select(t.id),
aria: 'Open ' + t.airline + ' ticket from ' + t.date,
mt: i === 0 ? '0' : '-14px',
h: i === pastList.length - 1 ? 'auto' : '72px'
}));

return {
accent: accent,
d1: dd[0], d2: dd[1],
cur: cur,
isPast: past, isNext: !past,
backToNext: () => this.select(NEXT_ID),
monthName: MONTHS[st.vm], year: String(st.vy),
prevMonth: () => { const m = st.vm - 1; this.setState(m < 0 ? { vm: 11, vy: st.vy - 1 } : { vm: m }); },
nextMonth: () => { const m = st.vm + 1; this.setState(m > 11 ? { vm: 0, vy: st.vy + 1 } : { vm: m }); },
cells: cells,
plansOpen: st.plansOpen,
plansExpanded: st.plansOpen ? 'true' : 'false',
chev: st.plansOpen ? 'rotate(180deg)' : 'rotate(0deg)',
togglePlans: () => this.setState({ plansOpen: !st.plansOpen }),
planCount: plans.length === 0 ? 'None yet' : plans.length + (plans.length === 1 ? ' plan' : ' plans'),
plans: plans,
stack: stack
};
}
}
</script>
</body>
</html>
